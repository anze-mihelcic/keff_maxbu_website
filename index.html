<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a calculation</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { width: min(520px, calc(100% - 40px)); padding: 28px; border: 1px solid GrayText; border-radius: 12px; }
  h1 { margin-top: 0; }
  select { width: 100%; padding: 10px; font: inherit; background: Canvas; color: CanvasText; border: 1px solid GrayText; border-radius: 7px; }
  a { color: LinkText; }
</style>
</head>
<body>
<main>
  <h1>Choose a calculation</h1>
  <p>Each calculation uses its own plot scale and units.</p>
  <label for="calculation">Calculation</label>
  <select id="calculation" onchange="if (this.value) location.href = this.value">
    <option value="">Select a calculation…</option>
    <option value="assembly-EFPD/">Assembly Efpd</option>
<option value="assembly-MWdkgHM/">Assembly Mwdkghm</option>
  </select>
  <noscript><ul><li><a href="assembly-EFPD/">Assembly Efpd</a></li>
<li><a href="assembly-MWdkgHM/">Assembly Mwdkghm</a></li></ul></noscript>
</main>
</body>
</html>
